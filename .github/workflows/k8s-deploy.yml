name: Deploy to k8s (self-hosted)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: [self-hosted, k8s, prod]
    env:
  # Non-sensitive configuration should be set as repository Variables (Settings → Variables):
  # DOCKERHUB_USERNAME, IMAGE_REPOSITORY (optional), DASHBOARD_ENABLE_AUTHENTICATION,
  # GLPI_URL, DEBUG_SEARCH_OPTIONS, URL_DASHBOARD, OIDC_CLIENT_ID, REALM_NAME
  # Sensitive values must be stored as repository Secrets: DOCKERHUB_TOKEN, GLPI_USER_TOKEN,
  # OIDC_CLIENT_SECRET, FLASK_SECRET_KEY
      NAMESPACE: dashboard-glpi
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
      DASHBOARD_ENABLE_AUTHENTICATION: ${{ vars.DASHBOARD_ENABLE_AUTHENTICATION }}
      GLPI_URL: ${{ vars.GLPI_URL }}
      DEBUG_SEARCH_OPTIONS: ${{ vars.DEBUG_SEARCH_OPTIONS }}
      URL_DASHBOARD: ${{ vars.URL_DASHBOARD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4 

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine image name and version
        id: vars
        run: |
          set -euo pipefail
          # IMAGE_REPOSITORY can be provided via Repository Variables (IMAGE_REPOSITORY). If not, use DOCKERHUB_USERNAME/dashboard-glpi
          if [ -n "${IMAGE_REPOSITORY:-}" ]; then
            IMAGE_REPOSITORY="${IMAGE_REPOSITORY}"
          else
            IMAGE_REPOSITORY="${DOCKERHUB_USERNAME:-}/${GITHUB_REPOSITORY##*/}"
          fi
          # unique image version: short sha + run number
          IMAGE_VERSION="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"
          echo "IMAGE_REPOSITORY=${IMAGE_REPOSITORY}" >> $GITHUB_OUTPUT
          echo "IMAGE_VERSION=${IMAGE_VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.IMAGE_REPOSITORY }}:${{ steps.vars.outputs.IMAGE_VERSION }}
            ${{ steps.vars.outputs.IMAGE_REPOSITORY }}:latest

      - name: Prepare k8s manifests (replace placeholders)
        env:
          IMAGE_REPOSITORY: ${{ steps.vars.outputs.IMAGE_REPOSITORY }}
          IMAGE_VERSION: ${{ steps.vars.outputs.IMAGE_VERSION }}
          GLPI_USER_TOKEN: ${{ secrets.GLPI_USER_TOKEN }}
          DASHBOARD_ENABLE_AUTHENTICATION: ${{ env.DASHBOARD_ENABLE_AUTHENTICATION }}
          GLPI_URL: ${{ env.GLPI_URL }}
          DEBUG_SEARCH_OPTIONS: ${{ env.DEBUG_SEARCH_OPTIONS }}
          URL_DASHBOARD: ${{ env.URL_DASHBOARD }}
          OIDC_CLIENT_ID: ${{ vars.OIDC_CLIENT_ID }}
          REALM_NAME: ${{ vars.REALM_NAME }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
          OIDC_SCOPES: ${{ vars.OIDC_SCOPES }}
          OIDC_VERIFY_TLS: ${{ vars.OIDC_VERIFY_TLS }}
        run: |
          set -euo pipefail
          mkdir -p k8s/prd/output
          cp k8s/prd/*.yaml k8s/prd/output/

          # imagem
          sed -i "s|<IMAGE_REPOSITORY>|${IMAGE_REPOSITORY}|g" k8s/prd/output/03-deployment.yaml
          sed -i "s|<IMAGE_VERSION>|${IMAGE_VERSION}|g"     k8s/prd/output/03-deployment.yaml

          # base64 para 'data:'
          GLPI_TOKEN_B64=$(printf '%s' "${GLPI_USER_TOKEN}"   | base64 | tr -d '\n')
          OIDC_CLIENT_SECRET_B64=$(printf '%s' "${OIDC_CLIENT_SECRET:-}" | base64 | tr -d '\n')
          FLASK_SECRET_KEY_B64=$(printf '%s' "${FLASK_SECRET_KEY:-}" | base64 | tr -d '\n')

          # defaults
          OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-dashboard-glpi}
          REALM_NAME=${REALM_NAME:-uvxp}

          # substituição EM <PLACEHOLDERS> (sem aspas) - Secrets
          sed -i "s|<GLPI_USER_TOKEN>|${GLPI_TOKEN_B64}|g"           k8s/prd/output/01-secrets.yaml
          sed -i "s|<OIDC_CLIENT_SECRET>|${OIDC_CLIENT_SECRET_B64}|g" k8s/prd/output/01-secrets.yaml
          sed -i "s|<FLASK_SECRET_KEY>|${FLASK_SECRET_KEY_B64}|g"     k8s/prd/output/01-secrets.yaml

          # configmap / ingress
          sed -i "s|<DASHBOARD_ENABLE_AUTHENTICATION>|${DASHBOARD_ENABLE_AUTHENTICATION}|g" k8s/prd/output/02-configmap.yaml
          sed -i "s|<GLPI_URL>|${GLPI_URL}|g" k8s/prd/output/02-configmap.yaml
          sed -i "s|<DEBUG_SEARCH_OPTIONS>|${DEBUG_SEARCH_OPTIONS}|g" k8s/prd/output/02-configmap.yaml
          sed -i "s|<CLIENT_ID>|${OIDC_CLIENT_ID}|g" k8s/prd/output/02-configmap.yaml
          sed -i "s|<REALM_NAME>|${REALM_NAME}|g" k8s/prd/output/02-configmap.yaml
          sed -i "s|<OIDC_SCOPES>|${OIDC_SCOPES:-openid profile email}|g" k8s/prd/output/02-configmap.yaml
          sed -i "s|<OIDC_VERIFY_TLS>|${OIDC_VERIFY_TLS:-true}|g" k8s/prd/output/02-configmap.yaml
          sed -i "s|<DASHBOARD_DOMAIN>|${URL_DASHBOARD}|g" k8s/prd/output/02-configmap.yaml
          sed -i "s|<URL_DASHBOARD>|${URL_DASHBOARD}|g" k8s/prd/output/05-ingress.yaml

          # sanity check: não pode sobrar placeholders
          if grep -R "<GLPI_USER_TOKEN>\|<OIDC_CLIENT_SECRET>\|<FLASK_SECRET_KEY>" k8s/prd/output/01-secrets.yaml; then
            echo "Placeholders de Secret não foram substituídos"; exit 1
          fi
          if grep -R "<CLIENT_ID>\|<REALM_NAME>\|<OIDC_SCOPES>\|<OIDC_VERIFY_TLS>\|<DASHBOARD_DOMAIN>\|<DASHBOARD_ENABLE_AUTHENTICATION>\|<GLPI_URL>\|<DEBUG_SEARCH_OPTIONS>" k8s/prd/output/02-configmap.yaml; then
            echo "Placeholders de ConfigMap não foram substituídos"; exit 1
          fi

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.30.0

      - name: Apply manifests to cluster
        run: |
          set -euo pipefail
          # Use kubeconfig available on runner pod (in-cluster SA) or KUBECONFIG env provided by runner
          kubectl apply -f k8s/prd/output
          # wait for rollout
          kubectl -n ${NAMESPACE} rollout status deployment/dashboard-glpi --timeout=120s

      - name: Notify result
        if: ${{ success() }}
        run: |
          echo "Deployment succeeded: ${IMAGE_REPOSITORY}:${IMAGE_VERSION}"

      - name: Notify failure
        if: ${{ failure() }}
        run: |
          echo "Deployment failed" >&2
